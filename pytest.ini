[pytest]
# ── Markers ──────────────────────────────────────────────────────────────────
# `integration` needs a live backend; the WebSocket suite also waits out a
# poll interval. Those tests are excluded from the default run:
#
#     pytest -m "not integration"     fast, no backend required
#     pytest -m integration           needs `uvicorn app.main:app --port 8010`
#
# `real` contacts OpenSky and spends genuine credits; never automatic.
markers =
    integration: needs a running backend
    real: contacts OpenSky and spends real credits

addopts = -ra
testpaths = tests
